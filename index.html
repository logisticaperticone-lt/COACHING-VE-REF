<style>
  :root{
    --bg:#F1F4EF;
    --paper:#FFFFFF;
    --ink:#1B231F;
    --ink-soft:#5C6862;
    --ink-faint:#8B958F;
    --line:#DFE4DC;
    --line-soft:#EBEEE8;
    --accent:#2F6F5E;
    --accent-ink:#173D33;
    --accent-soft:#E1EDE7;
    --amber:#C98A2B;
    --amber-soft:#F6E9D2;
    --grade-a:#2F6F5E;
    --grade-a-soft:#E1EDE7;
    --grade-b:#3E7CA6;
    --grade-b-soft:#E1EBF1;
    --grade-c:#C98A2B;
    --grade-c-soft:#F6E9D2;
    --grade-d:#B24A3A;
    --grade-d-soft:#F5E2DE;
    --radius:10px;
    --shadow:0 1px 2px rgba(27,35,31,0.06), 0 6px 20px -10px rgba(27,35,31,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono','SF Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

  /* ---------- shell ---------- */
  .shell{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:340px; flex:none; background:var(--paper); border-right:1px solid var(--line);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  }
  .brand{
    padding:22px 20px 16px; border-bottom:1px solid var(--line-soft);
  }
  .brand .cap{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent) 0 8%, transparent 8% 16%, var(--accent) 16% 24%, transparent 24% 32%, var(--accent) 32% 40%, transparent 40% 48%, var(--accent) 48% 56%, transparent 56% 64%, var(--accent) 64% 72%, transparent 72% 80%, var(--accent) 80% 88%, transparent 88% 96%);
    position:relative;
  }
  .brand .cap::after{
    content:''; position:absolute; inset:6px; border-radius:50%; background:var(--paper);
  }
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand h1{font-size:15.5px; margin:0; font-weight:700; letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--ink-soft);}

  .search-wrap{padding:14px 20px 10px;}
  .search-wrap input{
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line);
    font-size:13px; background:var(--bg); color:var(--ink); outline:none;
  }
  .search-wrap input:focus{border-color:var(--accent);}

  .actions-row{padding:2px 20px 12px; display:flex; flex-direction:column; gap:8px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    cursor:pointer; width:100%;
  }
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn svg{flex:none;}
  .file-input-hidden{display:none;}
  .toast{
    position:fixed; top:18px; right:18px; z-index:50;
    background:var(--ink); color:#fff; font-size:13px; font-weight:600;
    padding:11px 16px; border-radius:8px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(-6px);
    transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--grade-d);}
  .upload-help{font-size:11px; color:var(--ink-faint); padding:0 4px; line-height:1.4;}

  .vendor-list{overflow-y:auto; flex:1; padding:4px 10px 20px;}
  .sup-group{margin-top:10px;}
  .sup-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint);
    padding:8px 10px 4px; font-weight:600;
  }
  .vendor-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    cursor:pointer; border:1px solid transparent;
  }
  .vendor-item:hover{background:var(--bg);}
  .vendor-item.active{background:var(--accent-soft); border-color:var(--accent);}
  .vendor-item .name{font-size:13px; font-weight:600; flex:1; line-height:1.25;}
  .vendor-item .meta{font-size:10.5px; color:var(--ink-soft); font-weight:400;}
  .badge{
    font-size:11px; font-weight:700; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .badge-A{background:var(--grade-a-soft); color:var(--grade-a);}
  .badge-B{background:var(--grade-b-soft); color:var(--grade-b);}
  .badge-C{background:var(--grade-c-soft); color:var(--grade-c);}
  .badge-D{background:var(--grade-d-soft); color:var(--grade-d);}
  .trend{font-size:11px; font-weight:700;}
  .trend.up{color:var(--grade-a);}
  .trend.down{color:var(--grade-d);}
  .trend.flat{color:var(--ink-faint);}

  /* ---------- main ---------- */
  .main{flex:1; padding:28px 36px 60px; max-width:1040px;}
  .empty-state{padding:80px 20px; text-align:center; color:var(--ink-soft);}
  .empty-state .cap-lg{
    width:56px;height:56px;border-radius:50%;margin:0 auto 14px;
    background:conic-gradient(from 0deg, var(--accent) 0 8%, transparent 8% 16%, var(--accent) 16% 24%, transparent 24% 32%, var(--accent) 32% 40%, transparent 40% 48%, var(--accent) 48% 56%, transparent 56% 64%, var(--accent) 64% 72%, transparent 72% 80%, var(--accent) 80% 88%, transparent 88% 96%);
    position:relative;
  }
  .empty-state .cap-lg::after{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--bg);}

  .head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px;}
  .vendor-title h2{margin:0 0 4px; font-size:22px; letter-spacing:-0.01em;}
  .vendor-title .sub{font-size:13px; color:var(--ink-soft);}
  .vendor-title .sub b{color:var(--ink);}

  .cap-hero{display:flex; align-items:center; gap:12px;}
  .cap-hero .cap-badge{
    width:58px; height:58px; border-radius:50%; position:relative; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .cap-hero .cap-badge::before{
    content:''; position:absolute; inset:0; border-radius:50%;
  }
  .cap-badge.g-A::before{background:conic-gradient(from 0deg, var(--grade-a) 0 8%, transparent 8% 16%, var(--grade-a) 16% 24%, transparent 24% 32%, var(--grade-a) 32% 40%, transparent 40% 48%, var(--grade-a) 48% 56%, transparent 56% 64%, var(--grade-a) 64% 72%, transparent 72% 80%, var(--grade-a) 80% 88%, transparent 88% 96%);}
  .cap-badge.g-B::before{background:conic-gradient(from 0deg, var(--grade-b) 0 8%, transparent 8% 16%, var(--grade-b) 16% 24%, transparent 24% 32%, var(--grade-b) 32% 40%, transparent 40% 48%, var(--grade-b) 48% 56%, transparent 56% 64%, var(--grade-b) 64% 72%, transparent 72% 80%, var(--grade-b) 80% 88%, transparent 88% 96%);}
  .cap-badge.g-C::before{background:conic-gradient(from 0deg, var(--grade-c) 0 8%, transparent 8% 16%, var(--grade-c) 16% 24%, transparent 24% 32%, var(--grade-c) 32% 40%, transparent 40% 48%, var(--grade-c) 48% 56%, transparent 56% 64%, var(--grade-c) 64% 72%, transparent 72% 80%, var(--grade-c) 80% 88%, transparent 88% 96%);}
  .cap-badge.g-D::before{background:conic-gradient(from 0deg, var(--grade-d) 0 8%, transparent 8% 16%, var(--grade-d) 16% 24%, transparent 24% 32%, var(--grade-d) 32% 40%, transparent 40% 48%, var(--grade-d) 48% 56%, transparent 56% 64%, var(--grade-d) 64% 72%, transparent 72% 80%, var(--grade-d) 80% 88%, transparent 88% 96%);}
  .cap-inner{
    position:relative; width:38px; height:38px; border-radius:50%; background:var(--paper);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px;
  }
  .g-A .cap-inner{color:var(--grade-a);}
  .g-B .cap-inner{color:var(--grade-b);}
  .g-C .cap-inner{color:var(--grade-c);}
  .g-D .cap-inner{color:var(--grade-d);}
  .cap-hero .cap-text{font-size:12px; color:var(--ink-soft); line-height:1.35;}
  .cap-hero .cap-text .pct{font-size:20px; font-weight:800; color:var(--ink); display:block;}

  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .kpi{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .kpi .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600;}
  .kpi .value{font-size:21px; font-weight:800; margin-top:5px;}
  .kpi .sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow);}
  .panel h3{margin:0 0 2px; font-size:14px; font-weight:700;}
  .panel .panel-sub{font-size:12px; color:var(--ink-soft); margin:0 0 16px;}
  .chart-wrap{position:relative; height:280px;}
  .chart-wrap svg{width:100%; height:100%; overflow:visible;}
  .chart-wrap .gridline{stroke:#EBEEE8; stroke-width:1;}
  .chart-wrap .axis-label{font-size:10px; fill:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}
  .chart-wrap .x-label{font-size:10px; fill:var(--ink-faint); font-family:'Inter',sans-serif;}
  .chart-wrap .series-line{fill:none; stroke-linejoin:round; stroke-linecap:round;}
  .chart-wrap .series-point{cursor:pointer;}
  .chart-wrap .series-point:hover{stroke:var(--ink); stroke-width:2;}

  .legend-toggle{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .legend-chip{
    font-size:11px; padding:4px 10px; border-radius:20px; border:1px solid var(--line);
    cursor:pointer; user-select:none; color:var(--ink-soft); display:flex; align-items:center; gap:6px;
  }
  .legend-chip .dot{width:8px; height:8px; border-radius:50%;}
  .legend-chip.off{opacity:.35;}

  table.hist{width:100%; border-collapse:collapse; font-size:13px;}
  table.hist th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-faint); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line);
  }
  table.hist td{padding:10px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  table.hist tr:last-child td{border-bottom:none;}
  .hist-num{font-weight:700; color:var(--ink);}
  .notes-cell{color:var(--ink-soft); font-size:12.5px; max-width:280px;}
  .notes-cell.empty{color:var(--ink-faint); font-style:italic;}
  .sup-tag{font-size:11px; color:var(--ink-soft);}

  details.q-detail{margin-top:4px;}
  details.q-detail summary{cursor:pointer; font-size:11.5px; color:var(--accent); font-weight:600; list-style:none;}
  details.q-detail summary::-webkit-details-marker{display:none;}
  details.q-detail summary::before{content:'▸ '; }
  details.q-detail[open] summary::before{content:'▾ ';}
  .pilar-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px;}
  .pilar-cell{background:var(--bg); border-radius:8px; padding:8px 10px;}
  .pilar-cell .pn{font-size:10px; color:var(--ink-soft); line-height:1.2; min-height:24px;}
  .pilar-cell .pv{font-size:15px; font-weight:800; margin-top:4px;}
  .q-list{margin-top:8px; padding-left:0; list-style:none; font-size:11.5px; color:var(--ink-soft);}
  .q-list li{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line-soft);}
  .q-list li:last-child{border-bottom:none;}
  .q-score{font-weight:700; color:var(--ink);}

  footer.foot{margin-top:24px; font-size:11px; color:var(--ink-faint); text-align:center;}

  @media (max-width: 900px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; max-height:40vh;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .pilar-grid{grid-template-columns:repeat(2,1fr);}
    .main{padding:20px;}
  }
</style>
</head>

    <div class="brand">

  <main class="main" id="main">

</div>

<script>
const DATA = JSON.parse(document.getElementById('coaching-data').textContent);
const PILAR_COLORS = {
  blandas:      '#2F6F5E',
  rutina:       '#3E7CA6',
  oportunidades:'#C98A2B',

};
const GRADE_ORDER = {A:4,B:3,C:2,D:1};

let selectedVendor = null;
let hiddenSeries = new Set(); // pilar ids hidden from chart

function fmtDate(c){
  // accepts either a coaching object ({fecha, fecha_raw}) or a plain iso string (legacy calls)
  const iso = (c && typeof c === 'object') ? c.fecha : c;
  const raw = (c && typeof c === 'object') ? c.fecha_raw : null;
  if(!iso){
    return raw || '—';
  }
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return raw || iso;
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'short', year:'numeric'});
}

function trendArrow(vendor){
  if(vendor.n_coachings < 2) return {cls:'flat', txt:'—'};
  const diff = vendor.ultimo_total - vendor.primer_total;
  if(diff > 1) return {cls:'up', txt:'▲ ' + diff.toFixed(1) + ' pts'};
  if(diff < -1) return {cls:'down', txt:'▼ ' + Math.abs(diff).toFixed(1) + ' pts'};
  return {cls:'flat', txt:'· estable'};
}

function renderSidebar(filter){
  const list = document.getElementById('vendorList');
  list.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();

  const bySupervisor = {};
  DATA.vendors.forEach(v => {
    if(f && !v.nombre.toLowerCase().includes(f) && !v.supervisor_actual.toLowerCase().includes(f)) return;
    (bySupervisor[v.supervisor_actual] = bySupervisor[v.supervisor_actual] || []).push(v);
  });

  const supNames = Object.keys(bySupervisor).sort();
  if(supNames.length === 0){

    return;

    const group = document.createElement('div');

function renderHistRow(c){

}

function escapeHtml(s){
  const d = document.createElement('div');

  return d.innerHTML;
}

function buildChart(vendor){
  const holder = document.getElementById('trendChart');
  const W = 900, H = 280;
  const padL = 34, padR = 14, padT = 12, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const n = vendor.coachings.length;
  const xAt = (i) => n === 1 ? padL + plotW/2 : padL + (plotW * i) / (n - 1);
  const yAt = (v) => padT + plotH - (plotH * v) / 100;

  const series = [
    {
      key: 'total',
      label: 'Total',
      color: '#1B231F',
      dash: '',
      width: 3,
      radius: 4,
      data: vendor.coachings.map(c => c.total_pct),
    },
    ...DATA.pilares_meta.map(pm => ({
      key: pm.id,
      label: pm.short,
      color: PILAR_COLORS[pm.id],
      dash: '4,3',
      width: 1.75,
      radius: 2.75,
      data: vendor.coachings.map(c => c.pilares.find(p => p.id === pm.id).pct),
    }))
  ];

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;

  // gridlines + y labels
  [0,20,40,60,80,100].forEach(v => {
    const y = yAt(v);
    svg += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    svg += `<text class="axis-label" x="${padL-8}" y="${y+3}" text-anchor="end">${v}%</text>`;
  });

  // x labels
  vendor.coachings.forEach((c,i) => {
    const x = xAt(i);
    svg += `<text class="x-label" x="${x}" y="${H-8}" text-anchor="middle">#${c.numero} · ${fmtDate(c)}</text>`;
  });

  // series lines + points
  series.forEach(s => {
    const pts = s.data.map((v,i) => `${xAt(i)},${yAt(v)}`).join(' ');
    const hidden = hiddenSeries.has(s.key);
    svg += `<g class="series-group" data-key="${s.key}" style="${hidden ? 'display:none' : ''}">`;
    svg += `<polyline class="series-line" points="${pts}" stroke="${s.color}" stroke-width="${s.width}" stroke-dasharray="${s.dash}"/>`;
    s.data.forEach((v,i) => {
      svg += `<circle class="series-point" cx="${xAt(i)}" cy="${yAt(v)}" r="${s.radius}" fill="${s.color}" stroke="${s.color}"><title>${s.label} — Coaching #${vendor.coachings[i].numero} (${fmtDate(vendor.coachings[i])}): ${v.toFixed(1)}%</title></circle>`;
    });
    svg += `</g>`;
  });

  svg += `</svg>`;
  holder.innerHTML = svg;
}

function buildLegend(vendor){
  const wrap = document.getElementById('legendToggle');
  const items = [
    {key:'total', label:'Total', color:'#1B231F'},
    ...DATA.pilares_meta.map(pm => ({key:pm.id, label:pm.short, color:PILAR_COLORS[pm.id]}))
  ];
  wrap.innerHTML = items.map(it => `
    <span class="legend-chip ${hiddenSeries.has(it.key)?'off':''}" data-key="${it.key}">
      <span class="dot" style="background:${it.color}"></span>${it.label}
    </span>
  `).join('');
  wrap.querySelectorAll('.legend-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.key;
      if(hiddenSeries.has(key)) hiddenSeries.delete(key); else hiddenSeries.add(key);
      chip.classList.toggle('off');
      const grp = document.querySelector(`.series-group[data-key="${key}"]`);
      if(grp) grp.style.display = hiddenSeries.has(key) ? 'none' : '';
    });
  });
}

    questions:[
      {label:'Planif y ejecución de rutina', weight:5},

    ]},
];

function gradeFor(avgScore){
  if(avgScore < 1.5) return 'D';
  if(avgScore < 2.5) return 'C';
  if(avgScore < 3.5) return 'B';
  return 'A';
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  // strip BOM if present
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* skip, \n handles the break */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] && r[0].trim() !== ''));
}

function normName(s){
  return (s || '').trim().replace(/\s+/g, ' ');
}

// best-effort date parsing; returns a sortable timestamp plus a display-ready ISO date
function parseTimestamp(raw){
  if(!raw) return { ts: null, iso: null };
  const s = raw.trim();

  // ISO-like: yyyy-mm-dd[ hh:mm[:ss]]
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    const y=+m[1], mo=+m[2], d=+m[3], hh=+(m[4]||0), mi=+(m[5]||0), se=+(m[6]||0);
    const dt = new Date(y, mo-1, d, hh, mi, se);
    return { ts: dt.getTime(), iso: `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}` };
  }
  // dd/mm/yyyy[ hh:mm[:ss]] (or mm/dd/yyyy if the first heuristic fails)
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let d=+m[1], mo=+m[2]; const y=+m[3], hh=+(m[4]||0), mi=+(m[5]||0), se=+(m[6]||0);
    if(d > 12 && mo <= 12){ /* d/m/y, keep as-is */ }
    else if(mo > 12 && d <= 12){ const t=d; d=mo; mo=t; } // only the swapped order is valid
    const dt = new Date(y, mo-1, d, hh, mi, se);
    return { ts: dt.getTime(), iso: `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}` };
  }
  return { ts: null, iso: null }; // unrecognized — sorted last, shown as raw text
}

function processCSVRows(rows){
  if(rows.length < 2) throw new Error('El archivo no tiene filas de respuestas.');
  const nQuestions = PILARES_DEF.reduce((a,p) => a + p.questions.length, 0);
  const notesIdx = 3 + nQuestions;
  const dataRows = rows.slice(1); // skip header
  const byVendor = {};
  let nOk = 0;
  let rowOrder = 0;

  dataRows.forEach(r => {
    if(r.length < notesIdx + 1) return; // fila incompleta, se ignora
    const rawDate = r[0];
    const supervisor = normName(r[1]);
    const promotor = normName(r[2]);
    if(!promotor) return;
    const rawScores = r.slice(3, notesIdx).map(v => parseFloat(v));
    if(rawScores.some(v => isNaN(v))) return; // coaching incompleto, se ignora
    let notas = (r[notesIdx] || '').trim();
    if(['.', '-', ''].includes(notas)) notas = '';

    let idx = 0;
    const pilares = [];
    let totalPct = 0;
    PILARES_DEF.forEach(p => {
      let pts = 0;
      const maxPts = p.questions.reduce((a,q) => a + q.weight, 0);
      const qDetail = [];
      p.questions.forEach(q => {
        const score = rawScores[idx];
        pts += (q.weight / 4) * score;
        qDetail.push({label: q.label, weight: q.weight, score});
        idx++;
      });
      pilares.push({ id:p.id, name:p.name, short:p.short, pct: Math.round((pts / maxPts) * 10000)/100, questions: qDetail });
      totalPct += pts;
    });

    const avgScore = rawScores.reduce((a,b)=>a+b,0) / nQuestions;
    const { ts, iso } = parseTimestamp(rawDate);

    const coaching = {
      promotor, supervisor,
      fecha: iso,
      fecha_raw: iso ? null : (rawDate || '').split(' ')[0],
      total_pct: Math.round(totalPct * 100) / 100,
      avg_score: Math.round(avgScore * 1000) / 1000,
      grade: gradeFor(avgScore),
      pilares,
      notas,
      _ts: ts,
      _rowOrder: rowOrder++,
    };
    (byVendor[promotor] = byVendor[promotor] || []).push(coaching);
    nOk++;
  });

  if(nOk === 0) throw new Error('No se reconoció ningún coaching completo en el archivo.');

  const vendors = [];
  Object.keys(byVendor).sort().forEach(name => {
    const coachings = byVendor[name];
    // ordenar cronológicamente por fecha real; si una fecha no se pudo interpretar,
    // esa fila se ubica al final conservando el orden en que apareció en el archivo
    coachings.sort((a, b) => {
      if(a._ts != null && b._ts != null) return a._ts - b._ts;
      if(a._ts != null) return -1;
      if(b._ts != null) return 1;
      return a._rowOrder - b._rowOrder;
    });
    coachings.forEach((c,i) => c.numero = i+1);
    const supervisores = [...new Set(coachings.map(c => c.supervisor))].sort();
    vendors.push({
      nombre: name,
      supervisores,
      supervisor_actual: coachings[coachings.length-1].supervisor,
      n_coachings: coachings.length,
      ultimo_total: coachings[coachings.length-1].total_pct,
      ultima_nota: coachings[coachings.length-1].grade,
      primer_total: coachings[0].total_pct,
      coachings,
    });
  });

  return {
    pilares_meta: PILARES_DEF.map(p => ({id:p.id, name:p.name, short:p.short})),
    vendors,
    generated_from: 'CSV importado manualmente',
    n_registros: nOk,
  };
}

        renderSidebar(document.getElementById('searchInput').value);
      }
      showToast(`Base actualizada: ${newData.n_registros} coachings · ${newData.vendors.length} activadores`);
    } catch(err){
      showToast('No se pudo procesar el archivo: ' + err.message, true);
    }
    document.getElementById('csvFileInput').value = '';
  };
  reader.readAsText(file, 'UTF-8');
});

document.getElementById('btnDownload').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  // remove the transient toast node from the exported copy
  const toastEl = clone.querySelector('#toast');
  if(toastEl) toastEl.className = 'toast';
  const html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `Coaching_Vendedores_${stamp}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Descarga iniciada');
});

</script>
</body>
</html>
